<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="512" height="512">
  <defs>
    <!-- Smooth transition from your vibrant neon lime into a slightly deeper forest forest shade for contrast -->
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3d240" />
      <stop offset="100%" stop-color="#c8f060" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ff88" />
      <stop offset="100%" stop-color="#c8f060" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#1e293b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Image Frame -->
  <rect x="2" y="4" width="16" height="16" rx="3" fill="none" stroke="url(#primaryGrad)" stroke-width="2" filter="url(#dropShadow)" />

  <!-- Sun/Iris -->
  <circle cx="6.5" cy="8.5" r="2" fill="url(#primaryGrad)" />

  <!-- Mountains/Graph -->
  <path d="M3 19 L8 12 L12 16 L15 12 L17 14.5 L17 19 Z" fill="url(#primaryGrad)" opacity="0.85" stroke="url(#primaryGrad)" stroke-width="1" stroke-linejoin="round" />

  <!-- Compression / Optimization Magic Arrows -->
  <g transform="translate(14, 2)">
    <!-- Main Magic Sparkle -->
    <path d="M5 0 L6.3 3.7 L10 5 L6.3 6.3 L5 10 L3.7 6.3 L0 5 L3.7 3.7 Z" fill="url(#accentGrad)" />
    
    <!-- Small companion sparkle -->
    <path d="M2 11 L2.6 12.4 L4 13 L2.6 13.6 L2 15 L1.4 13.6 L0 13 L1.4 12.4 Z" fill="url(#primaryGrad)" opacity="0.7" />
  </g>

  <!-- Bottom Right Dynamic Corner Arrow -->
  <path d="M21 16 L21 21 L16 21" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M15 15 L21 21" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-linecap="round" />
</svg>
